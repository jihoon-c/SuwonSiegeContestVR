; Game Feature Plugin(GF_*)이 동작하려면 Asset Manager가 GameFeatureData 타입을
; Primary Asset으로 스캔해야 한다. 이 항목이 없으면 시작 시 다음 경고가 발생한다:
;   "Asset Manager settings do not include an entry for assets of type
;    GameFeatureData, which is required for game feature plugins to function."
;
; Directories의 "/Game/Unused"는 의도된 더미 경로다. 각 Game Feature Plugin은
; 자신의 마운트 포인트에서 GameFeatureData를 직접 등록하므로 /Game 전체를
; 스캔할 필요가 없다. Asset Manager에는 "타입 등록"만 필요하다.
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))

; 음성 인식 모델(onnx/tokens)은 .uasset이 아니므로 NonUFS로 스테이징해야 패키지에 포함된다.
; 파일 자체는 커밋하지 않으며 Scripts/DownloadKoreanVoiceModel.py 로 내려받는다.
